{% extends "fe/base.html" %}
{% block title %}{{ form_title }}{% endblock %}

{% block css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
{% endblock %}

{% block content %}
  <div class="form-page">
    <h1 class="page-title">{{ form_title }}</h1>

    <div id="offline-banner" class="form-offline-banner">
      ⚠ Нет связи. Запись сохранится локально и отправится автоматически,
      когда появится интернет.
    </div>

    <form action="{{ form_action }}" method="POST" data-offline-queue>
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="form-text">Текст</label>
        <textarea id="form-text" name="text" class="form-textarea"
                  rows="5" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
      <a href="javascript:history.back()" class="btn btn-outline btn-block">Отмена</a>
    </form>
  </div>
{% endblock %}

{% block js %}
  <script src="{{ url_for('static', filename='js/form.js') }}"></script>
{% endblock %}
