{% extends "base.html" %}
{% block title %}Вход — СМП/НМП{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5 col-xl-4">
    <h1 class="h3 mb-3 text-center">Вход в систему</h1>
    <form method="post" class="card shadow-sm card-body">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="mb-3">
        <label for="username" class="form-label">Логин</label>
        <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" autocapitalize="none" autofocus required>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Пароль</label>
        <input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
