{% extends "base.html" %}
{% block title %}Новый дневник — СМП/НМП{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Добавить «Дневник»</h1>
<p class="text-muted">Вызов №{{ call_id }}</p>

<form method="post" class="card shadow-sm card-body">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label for="author" class="form-label">Автор *</label>
    <input class="form-control form-control-lg" id="author" name="author" value="{{ values.author }}" required>
  </div>
  <div class="mb-4">
    <label for="text" class="form-label">Текст записи *</label>
    <textarea class="form-control form-control-lg" id="text" name="text" rows="6" required>{{ values.text }}</textarea>
  </div>
  <div class="d-flex gap-2 flex-wrap">
    <button type="submit" class="btn btn-success btn-lg">Сохранить</button>
    <a class="btn btn-outline-secondary btn-lg" href="{{ url_for('call_detail', call_id=call_id) }}">Отмена</a>
  </div>
</form>
{% endblock %}
